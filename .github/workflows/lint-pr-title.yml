name: Lint PR title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  lint-pr-title:
    name: Conventional commit PR title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Allow: fix, feat, chore, docs, refactor, test, style, perf, ci, build
          types: |
            fix
            feat
            chore
            docs
            refactor
            test
            style
            perf
            ci
            build
          requireScope: false
