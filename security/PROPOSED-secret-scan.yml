# PROPOSED — not installed. To adopt, copy to .github/workflows/secret-scan.yml
#
# Matches existing repo conventions (sentence-case `name:`, explicit least-privilege
# `permissions:`, named jobs, ubuntu-latest, pinned major action versions).
#
# Rationale: the one-off scan in trivy-secret-scan-report.md is a point-in-time result and
# goes stale on the next commit. This keeps the "no secrets" claim current on every PR.

name: Secret scan

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trivy-secrets:
    name: Trivy secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy secret scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: secret
          format: table
          # Fail the build on any secret finding. Trivy secret rules are MEDIUM+ by default.
          exit-code: "1"
          severity: CRITICAL,HIGH,MEDIUM

  gitleaks-history:
    name: Gitleaks (full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: Trivy only sees the working tree, so this is the complement that
          # catches a secret committed and later deleted within the PR branch.
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
# ---------------------------------------------------------------------------
# KNOWN ISSUE ON FIRST RUN
#
# This will FAIL immediately on the existing `jwt-token` match at
# src/alberta-wallet/reconstruct.ts:48 — the documentation example already triaged as a
# false positive (22-char signature; cryptographically cannot be a real RS256 token).
#
# Suppress it FIRST, or the workflow blocks every PR. Preferred, line-scoped:
#
#   // trivy:ignore:jwt-token
#
# on the line above it in reconstruct.ts. A file-wide `.trivyignore` entry also works but
# would mask any future real secret in that same file.
#
# Note gitleaks does NOT flag this token, so only the Trivy job needs the suppression.
# ---------------------------------------------------------------------------
